<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>钓鱼挂机控制台（声音版）</title>
<style>
  body { background:#1b1f27; color:#dfe3ea; font-family: "Microsoft YaHei", sans-serif;
         max-width: 860px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 20px; }
  h2 { font-size: 15px; margin: 18px 0 8px; color:#9fc1ff; }
  fieldset { border:1px solid #3a4150; margin:8px 0; }
  .row { display:flex; flex-wrap:wrap; gap:10px; margin:6px 0; align-items:center; }
  label { font-size:13px; }
  input { width:110px; background:#12151c; color:#dfe3ea; border:1px solid #3a4150;
          padding:4px 6px; font-size:13px; }
  input[type=text] { width:260px; }
  button { background:#2b5cc4; color:#fff; border:none; padding:8px 18px;
           font-size:14px; cursor:pointer; margin-right:8px; }
  button.stop { background:#b03a3a; }
  button.warn { background:#8a6d2f; }
  #status { background:#12151c; border:1px solid #3a4150; padding:10px 12px;
            font-size:14px; line-height:1.9; }
  .bar { display:inline-block; width:200px; height:10px; background:#262b36;
         vertical-align:middle; margin:0 6px; border-radius:5px; overflow:hidden; }
  .bar i { display:block; height:100%; background:#7ddc7d; width:0%; }
  .ok { color:#7ddc7d; } .bad { color:#ff8080; } .muted { color:#8a93a5; }
  #msg { font-size:13px; min-height:18px; margin-top:6px; }
  #test { font-size:13px; min-height:18px; margin-top:4px; }
</style>
</head>
<body>
<h1>🎣 钓鱼挂机控制台（声音版：听到咬钩音效 → 左键）</h1>

<div id="status">加载中…</div>

<h2>参数</h2>
<fieldset>
  <div class="row">
    <label>参考音效 <input id="sound_file" type="text" placeholder="TIMETOUP.wav"></label>
  </div>
  <div class="row">
    <label>得分阈值 <input id="threshold" type="number" step="0.05" min="0.3" max="1"></label>
    <label>冷却(秒) <input id="cooldown" type="number" step="0.1"></label>
    <label>动作 <input id="action" placeholder="click 或 f / space"></label>
  </div>
  <div class="row">
    <label>监听设备 <select id="device"></select></label>
    <label>采样率 <input id="samplerate" type="number"></label>
  </div>
</fieldset>
<div class="row">
  <button onclick="saveCfg()">保存配置</button>
  <button class="warn" onclick="apiPost('/api/play')">▶ 试听音效</button>
  <button class="warn" onclick="runTest()">🔍 自测（播放并验证检测）</button>
</div>
<div id="test"></div>
<div id="msg"></div>

<h2>启动 / 停止</h2>
<div class="row">
  <button id="btnStart" onclick="apiPost('/api/start').then(refresh)">▶ 启动挂机</button>
  <button id="btnStop" class="stop" onclick="apiPost('/api/stop').then(refresh)">■ 停止</button>
</div>

<script>
const $ = id => document.getElementById(id);

function fillForm(c) {
  $("sound_file").value = c.sound_file;
  $("threshold").value = c.threshold;
  $("cooldown").value = c.cooldown;
  $("action").value = c.action;
  $("samplerate").value = c.samplerate;
  const sel = $("device");
  if (sel.dataset.loaded !== "1") {
    fetch("/api/devices").then(r => r.json()).then(d => {
      sel.innerHTML = '<option value="">（系统默认输出）</option>';
      for (const n of d.devices)
        sel.innerHTML += `<option value="${n.replace(/"/g,'&quot;')}">${n}</option>`;
      sel.value = c.device || "";
      sel.dataset.loaded = "1";
    });
  } else sel.value = c.device || "";
}

async function refresh() {
  try {
    const r = await (await fetch("/api/status")).json();
    fillForm(r.config);
    const s = r.state;
    const run = s.running ? '<span class="ok">● 运行中</span>' : '<span class="bad">○ 已停止</span>';
    const hot = s.score >= r.config.threshold;
    $("status").innerHTML =
      `状态：${run} ｜ 当前得分：<span class="${hot?'ok':'muted'}">${s.score.toFixed(3)}</span>` +
      `<span class="bar"><i id="scorebar"></i></span>阈值 ${r.config.threshold}` +
      `<br>音频电平：${(s.level*100).toFixed(1)} ｜ 已触发：${s.count} 次 ｜ 上次触发：${s.last || "无"}` +
      (s.error ? `<br><span class="bad">错误：${s.error}</span>` : "");
    const bar = $("scorebar");
    if (bar) bar.style.width = Math.min(100, s.score*100) + "%";
    $("btnStart").disabled = s.running;
    $("btnStop").disabled = !s.running;
    if (s.test && (s.test.running || s.test.result)) showTest(s.test);
  } catch (e) {
    $("status").innerHTML = '<span class="bad">无法连接后台，控制台进程可能已退出</span>';
  }
}

function showTest(t) {
  if (t.running) { $("test").innerHTML = "自测中：正在播放音效并监听…"; return; }
  const r = t.result;
  if (!r) { $("test").textContent = ""; return; }
  $("test").innerHTML = r.ok
    ? `<span class="ok">✓ 自测通过</span>（最高得分 ${r.score} ≥ 阈值 ${r.threshold}）`
    : `<span class="bad">✗ 自测未通过</span>（最高得分 ${r.score ?? "?"} < 阈值 ${r.threshold ?? "?"}）` +
      (r.error ? ` 错误：${r.error}` : "，请确认游戏声音从所选输出设备播放");
}

async function saveCfg() {
  const body = {
    sound_file: $("sound_file").value.trim() || "TIMETOUP.wav",
    threshold: +$("threshold").value,
    cooldown: +$("cooldown").value,
    action: $("action").value.trim() || "click",
    samplerate: +$("samplerate").value || 48000,
    device: $("device").value || null,
  };
  const r = await (await fetch("/api/config", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify(body)})).json();
  $("msg").textContent = r.ok ? "已保存（采样率/设备改动在下次启动时生效）" : ("保存失败: " + (r.error || ""));
  refresh();
}

async function apiPost(path) {
  const r = await (await fetch(path, {method: "POST"})).json();
  if (r.note) $("msg").textContent = r.note;
  return r;
}

async function runTest() {
  const r = await apiPost("/api/test");
  $("test").textContent = r.note || "";
}

refresh();
setInterval(refresh, 500);
</script>
</body>
</html>
