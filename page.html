<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>钓鱼挂机控制台（声音版）· 食叶羚_SYL 出品</title>
<style>
  body { background:#1b1f27; color:#dfe3ea; font-family: "Microsoft YaHei", sans-serif;
         max-width: 880px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 20px; }
  h2 { font-size: 15px; margin: 18px 0 8px; color:#9fc1ff; }
  fieldset { border:1px solid #3a4150; margin:8px 0; }
  fieldset.dirty { border-color:#c79a3a; }
  .row { display:flex; flex-wrap:wrap; gap:10px; margin:6px 0; align-items:center; }
  label { font-size:13px; }
  input, select { background:#12151c; color:#dfe3ea; border:1px solid #3a4150;
                  padding:4px 6px; font-size:13px; }
  input { width:110px; }
  input[type=text] { width:240px; }
  input[type=checkbox] { width:auto; }
  select { width:260px; }
  button { background:#2b5cc4; color:#fff; border:none; padding:8px 18px;
           font-size:14px; cursor:pointer; margin-right:8px; }
  button.stop { background:#b03a3a; }
  button.warn { background:#8a6d2f; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  #status { background:#12151c; border:1px solid #3a4150; padding:10px 12px;
            font-size:14px; line-height:1.9; }
  .bar { display:inline-block; width:180px; height:10px; background:#262b36;
         vertical-align:middle; margin:0 6px; border-radius:5px; overflow:hidden; }
  .bar i { display:block; height:100%; background:#7ddc7d; width:0%; }
  .ok { color:#7ddc7d; } .bad { color:#ff8080; } .muted { color:#8a93a5; }
  .warnc { color:#ffcc55; }
  #msg, #test, #diag, #actInfo { font-size:13px; line-height:1.7; margin-top:6px; }
  table.diag { border-collapse:collapse; font-size:13px; margin-top:6px; }
  table.diag td { border:1px solid #3a4150; padding:3px 8px; }
  .hint { color:#8a93a5; font-size:12px; margin-left:8px; }
  .author-tag { display:inline-block; background:linear-gradient(135deg,#c79a3a,#e6c069);
                color:#1b1f27; font-weight:bold; font-size:13px; padding:3px 12px;
                border-radius:14px; vertical-align:middle; margin-left:10px;
                letter-spacing:1px; box-shadow:0 0 8px rgba(230,192,105,.35); }
  .author-wm { position:fixed; right:14px; bottom:40px; color:rgba(230,192,105,.55);
               font-size:13px; font-weight:bold; letter-spacing:2px; pointer-events:none;
               transform:rotate(-0deg); z-index:99; }
  #footer { margin-top:26px; padding:12px 0 4px; border-top:1px dashed #3a4150;
            text-align:center; font-size:15px; font-weight:bold; color:#e6c069;
            letter-spacing:2px; }
  #footer .sub { font-size:12px; font-weight:normal; color:#8a93a5; margin-top:4px;
                 letter-spacing:0; }
</style>
</head>
<body>
<h1>🎣 钓鱼挂机控制台（声音版：咬钩 → 收鱼流程）<span class="author-tag">食叶羚_SYL</span></h1>
<div class="author-wm">食叶羚_SYL</div>

<div id="status">加载中…</div>
<div id="winInfo" class="muted" style="margin-top:6px"></div>

<h2>参数</h2>
<fieldset id="cfgbox">
  <div class="row">
    <label>得分阈值 <input id="threshold" type="number" step="0.05" min="0.1" max="1"></label>
    <label>冷却(秒) <input id="cooldown" type="number" step="0.1"></label>
    <label>打断检视延迟(秒) <input id="interrupt_delay" type="number" step="0.5" min="0"
      title="抬杆后等待多少秒再点一下打断检视"></label>
    <label>再次抛竿延迟(秒) <input id="recast_delay" type="number" step="0.5" min="0"
      title="打断检视后再等多少秒左键抛下一竿"></label>
  </div>
  <div class="row">
    <label>前台窗口限制 <input id="foreground_window" type="text"
      placeholder="推荐填游戏标题子串（如 三角洲）"
      title="仅当前台窗口标题含此子串时才点击；填游戏窗口标题的关键字，可彻底避免切出游戏后还在按键"></label>
    <label><input id="notify_sound" type="checkbox"> 抬杆提示音
      <span class="hint">轻柔的一声"叮~"，音量已压低</span></label>
  </div>
  <div class="row">
    <label>监听设备 <select id="device"></select></label>
    <label>采样率 <input id="samplerate" type="number"></label>
  </div>
</fieldset>
<div class="row">
  <button onclick="saveCfg()">💾 保存配置</button>
  <button class="warn" onclick="apiPost('/api/play')">▶ 试听音效</button>
  <button class="warn" onclick="apiPost('/api/notify-preview').then(r=>{$('msg').textContent=r.note||''})">🔔 试听提示音</button>
  <button class="warn" onclick="runTest()">🔍 自测（播放并验证检测）</button>
  <button class="warn" onclick="runDiag()">🩺 环境诊断</button>
</div>
<div id="msg"></div>
<div id="test"></div>
<div id="diag"></div>

<h2>测试按键
  <span class="hint">3 秒倒计时后用 mouse_event 点一下左键，留时间切回游戏窗口</span>
</h2>
<div class="row">
  <button id="btnTestAct" onclick="apiPost('/api/test-action').then(refresh)">⌨️ 3秒后点一下左键</button>
  <span id="actInfo" class="muted"></span>
</div>

<h2>启动 / 停止</h2>
<div class="row">
  <button id="btnStart" onclick="apiPost('/api/start').then(refresh)">▶ 启动挂机</button>
  <button id="btnStop" class="stop" onclick="apiPost('/api/stop').then(refresh)">■ 停止</button>
</div>

<script>
const $ = id => document.getElementById(id);
const FIELDS = ["threshold","cooldown","interrupt_delay","recast_delay",
               "foreground_window","notify_sound","samplerate","device"];
let dirty = false;          // 有未保存的修改时不覆盖输入框
let devicesLoaded = false;
let shownConfig = "";       // 上次已渲染的服务端配置

/* 用户一改动输入框就标记 dirty，避免被 0.5 秒的自动刷新覆盖 */
$("cfgbox").addEventListener("input", () => markDirty());
$("cfgbox").addEventListener("change", () => markDirty());
function markDirty() {
  if (!dirty) {
    dirty = true;
    $("cfgbox").classList.add("dirty");
    $("msg").innerHTML = '<span class="warnc">有未保存的修改，点"保存配置"后生效</span>';
  }
}

function fillForm(c) {
  $("threshold").value = c.threshold;
  $("cooldown").value = c.cooldown;
  $("interrupt_delay").value = c.interrupt_delay;
  $("recast_delay").value = c.recast_delay;
  $("foreground_window").value = c.foreground_window || "";
  $("notify_sound").checked = !!c.notify_sound;
  $("samplerate").value = c.samplerate;
  $("device").value = c.device || "";
}

function loadDevices(c) {
  fetch("/api/devices").then(r => r.json()).then(d => {
    const sel = $("device");
    sel.innerHTML = '<option value="">（系统默认输出）</option>';
    for (const n of d.devices)
      sel.innerHTML += `<option value="${n.replace(/"/g,'&quot;')}">${n}</option>`;
    sel.value = c.device || "";
    devicesLoaded = true;
  }).catch(() => { $("msg").innerHTML = '<span class="bad">设备列表加载失败</span>'; });
}

async function refresh() {
  try {
    const r = await (await fetch("/api/status")).json();
    const s = r.state, cfg = r.config;
    const sig = JSON.stringify(cfg);
    if (!dirty && sig !== shownConfig) { fillForm(cfg); shownConfig = sig; }
    if (!devicesLoaded) loadDevices(cfg);

    // ---- 主状态 ----
    const run = s.running ? '<span class="ok">● 运行中</span>' : '<span class="bad">○ 已停止</span>';
    const hot = s.score >= cfg.threshold;
    let seqInfo = "";
    if (s.seq && s.seq.steps) {
      seqInfo = `<br>上轮流程：` + s.seq.steps.map(
        ([n, ok]) => `${n}${ok ? '✓' : '<span class="bad">✗</span>'}`).join(" → ");
    } else if (s.seq && s.seq.busy) {
      seqInfo = `<br><span class="warnc">收鱼流程进行中…</span>`;
    }
    $("status").innerHTML =
      `状态：${run} ｜ 当前得分：<span class="${hot?'ok':'muted'}">${s.score.toFixed(3)}</span>` +
      `<span class="bar"><i id="scorebar"></i></span>阈值 ${cfg.threshold}` +
      `<br>峰值(自上次触发)：<span class="warnc">${(s.peak ?? 0).toFixed(3)}</span>` +
      ` ｜ 音频电平：${(s.level*100).toFixed(1)} ｜ 已收鱼：${s.count} 轮 ｜ 上次触发：${s.last || "无"}` +
      seqInfo +
      (s.error ? `<br><span class="bad">错误：${s.error}</span>` : "");
    const bar = $("scorebar");
    if (bar) bar.style.width = Math.min(100, s.score*100) + "%";
    $("btnStart").disabled = s.running;
    $("btnStop").disabled = !s.running;

    // ---- 自测 / 诊断 ----
    if (s.test && (s.test.running || s.test.result)) showTest(s.test);
    if (s.diag && (s.diag.running || s.diag.result)) showDiag(s.diag);

    // ---- 按键测试倒计时 ----
    const act = s.act || {};
    if (act.running) {
      $("actInfo").innerHTML = `<span class="warnc">● 倒计时 ${act.remaining.toFixed(1)}s</span>`;
      $("btnTestAct").disabled = true;
    } else {
      $("btnTestAct").disabled = false;
      // 仅在刚刚结束时显示
      if ($("actInfo").dataset.wasRunning === "true") {
        $("actInfo").innerHTML = '<span class="ok">已点下</span>';
        setTimeout(() => { $("actInfo").textContent = ""; }, 1500);
      }
      $("actInfo").dataset.wasRunning = "";
    }
    if (act.running) $("actInfo").dataset.wasRunning = "true";
  } catch (e) {
    $("status").innerHTML = '<span class="bad">无法连接后台，控制台进程可能已退出（start.bat 窗口是否已关闭？）</span>';
  }
}

function showTest(t) {
  if (t.running) { $("test").innerHTML = "自测中：正在播放音效并监听…"; return; }
  const r = t.result;
  if (!r) { $("test").textContent = ""; return; }
  if (r.ok) {
    $("test").innerHTML = `<span class="ok">✓ 自测通过</span>（最高得分 ${r.score} ≥ 阈值 ${r.threshold}）`;
  } else if (r.error) {
    $("test").innerHTML = `<span class="bad">✗ 自测失败：${r.error}</span>` +
      `<br><span class="muted">点"环境诊断"查看是哪一步失败</span>`;
  } else {
    $("test").innerHTML = `<span class="bad">✗ 自测未通过</span>（最高得分 ${r.score} < 阈值 ${r.threshold}）` +
      `<br><span class="muted">声音链路通了但没匹配上：确认游戏声音从所选输出设备播放</span>`;
  }
}

function showDiag(d) {
  if (d.running) { $("diag").innerHTML = "诊断中…"; return; }
  const r = d.result;
  if (!r) { $("diag").textContent = ""; return; }
  if (r.error) { $("diag").innerHTML = `<span class="bad">诊断失败：${r.error}</span>`; return; }
  let html = '<table class="diag">';
  for (const st of r.steps)
    html += `<tr><td>${st.ok ? '<span class="ok">✓</span>' : '<span class="bad">✗</span>'}</td>` +
            `<td>${st.name}</td><td class="${st.ok?'muted':'bad'}">${st.detail}</td></tr>`;
  $("diag").innerHTML = html + "</table>";
}

async function saveCfg() {
  const body = {
    threshold: +$("threshold").value,
    cooldown: +$("cooldown").value,
    interrupt_delay: +$("interrupt_delay").value,
    recast_delay: +$("recast_delay").value,
    foreground_window: $("foreground_window").value.trim(),
    notify_sound: $("notify_sound").checked,
    samplerate: +$("samplerate").value || 48000,
    device: $("device").value || null,
  };
  const r = await (await fetch("/api/config", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify(body)})).json();
  if (r.ok) {
    dirty = false;
    $("cfgbox").classList.remove("dirty");
    shownConfig = JSON.stringify(r.config);
    fillForm(r.config);
    $("msg").innerHTML = '<span class="ok">已保存</span>';
  } else {
    $("msg").innerHTML = `<span class="bad">保存失败：${r.error || "未知错误"}</span>`;
  }
  refresh();
}

async function apiPost(path) {
  const r = await (await fetch(path, {method: "POST"})).json();
  if (r.note) $("msg").textContent = r.note;
  return r;
}

const runTest = () => apiPost("/api/test").then(r => { $("test").textContent = r.note || ""; });
const runDiag = () => apiPost("/api/diag").then(r => { $("diag").textContent = r.note || ""; });

async function loadWinInfo() {
  try {
    const d = await (await fetch("/api/window")).json();
    const fg = d.foreground || "（无）";
    const gw = d.game_window ? `hwnd=${d.game_window.hwnd} “${d.game_window.title}”`
                              : '<span class="bad">未找到游戏窗口</span>';
    $("winInfo").innerHTML =
      `点击驱动：<b>mouse_event</b> ｜ 前台窗口：${fg} ｜ ${gw}`;
  } catch (e) {}
}
loadWinInfo();
setInterval(loadWinInfo, 2000);

refresh();
setInterval(refresh, 500);
</script>

<div id="footer">
  开源免费，倒卖必究！
  <div class="sub">作者：食叶羚_SYL ｜ 本软件在 GitHub 免费开源，任何收费售卖行为均未经作者授权</div>
</div>
</body>
</html>
